<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词跟读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        body {
            background-color: #f4f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 620px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .btn {
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-top-left {
            background-color: #607d8b;
            color: white;
        }
        .btn-top-right {
            background-color: #2196f3;
            color: white;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 4px 16px #00000012;
            text-align: center;
        }
        .word-text {
            font-size: 42px;
            font-weight: bold;
            color: #222;
            margin-bottom: 24px;
        }
        .mask-word {
            background: black;
            color: black;
            user-select: none;
        }
        .meaning-area {
            font-size: 20px;
            color: #444;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #e4e7ed;
            border-radius: 12px;
            margin-bottom: 36px;
            white-space: pre-line;
        }
        .mask-meaning {
            background: black;
            color: black;
            user-select: none;
        }
        .control-row {
            display: flex;
            gap:16px;
            justify-content: center;
        }
        .btn-prev {
            background-color: #9c27b0;
            color:white;
        }
        .btn-next {
            background-color: #009688;
            color:white;
        }
        .modal-wrap {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color: rgba(0,0,0,0.5);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .modal {
            background:#fff;
            border-radius:20px;
            width:100%;
            max-width:520px;
            padding:28px;
        }
        .modal h3 {
            margin-bottom:20px;
        }
        .modal input, .modal textarea {
            width:100%;
            padding:12px;
            border-radius:10px;
            border:1px solid #ccc;
            margin-bottom:14px;
            font-size:16px;
        }
        .modal-buttons {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:12px;
        }
        .btn-modal-blue {
            background:#2196f3;
            color:white;
        }
        .btn-modal-orange {
            background:#ff9800;
            color:white;
        }
        .btn-modal-gray {
            background:#757575;
            color:white;
        }
        .file-tip {
            font-size:14px;
            color:#666;
            margin:8px 0;
        }
        .status-tip {
            margin-top:24px;
            color:#666;
            font-size:15px;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <button class="btn btn-top-left" id="maskBtn">遮挡设置</button>
            <button class="btn btn-top-right" id="addBtn">+ 添加单词</button>
        </div>

        <div class="card">
            <div class="word-text" id="wordDisplay">--</div>
            <div class="meaning-area" id="meaningDisplay" contenteditable="true">请添加单词</div>
            <div class="control-row">
                <button class="btn btn-prev" id="prevBtn">上一个单词</button>
                <button class="btn btn-next" id="nextBtn">下一个单词</button>
            </div>
        </div>
        <div class="status-tip" id="statusTip">单词保存在浏览器本地</div>
    </div>

    <!-- 添加单词弹窗 -->
    <div class="modal-wrap" id="addModal">
        <div class="modal">
            <h3>新增单词</h3>
            <input type="text" id="inputWord" placeholder="输入英文单词">
            <textarea id="inputMeaning" rows="3" placeholder="输入你的专属释义"></textarea>
            <div class="file-tip">导入文件：仅支持TXT，一行一个英文单词，自动添加，释义后续手动填写</div>
            <input type="file" id="fileImport" accept=".txt">
            <div class="modal-buttons">
                <button class="btn btn-modal-blue" id="saveWordBtn">保存单词</button>
                <button class="btn btn-modal-orange" id="openEudicBtn">跳转欧路词典查词</button>
                <button class="btn btn-modal-gray" id="closeModalBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 遮挡选项弹窗 -->
    <div class="modal-wrap" id="maskModal">
        <div class="modal">
            <h3>遮挡选项</h3>
            <div class="modal-buttons">
                <button class="btn btn-modal-blue" id="maskEn">遮挡英文</button>
                <button class="btn btn-modal-orange" id="maskZh">遮挡释义</button>
                <button class="btn btn-modal-gray" id="maskAllOff">全部取消遮挡</button>
            </div>
        </div>
    </div>

<script>
    let wordList = [];
    let currentIndex = 0;
    const dictCache = {};
    const isLocalFile = window.location.protocol === "file:";

    const wordDisplay = document.getElementById('wordDisplay');
    const meaningDisplay = document.getElementById('meaningDisplay');
    const statusTip = document.getElementById('statusTip');
    const addModal = document.getElementById('addModal');
    const maskModal = document.getElementById('maskModal');
    const inputWord = document.getElementById('inputWord');
    const inputMeaning = document.getElementById('inputMeaning');
    const fileImport = document.getElementById('fileImport');

    // 读取本地存储
    function loadFromStorage() {
        const saved = localStorage.getItem("myWordList");
        if(saved) wordList = JSON.parse(saved);
        render();
    }
    function saveStorage() {
        localStorage.setItem("myWordList", JSON.stringify(wordList));
    }

    // 渲染当前单词
    function render() {
        if(wordList.length === 0) {
            wordDisplay.innerText = "暂无单词";
            meaningDisplay.innerText = "点右上角 + 添加单词";
            return;
        }
        const item = wordList[currentIndex];
        wordDisplay.innerText = item.en;
        meaningDisplay.innerText = item.userMean;
    }

    // 切换单词自动跟读
    async function switchWord(index) {
        if(wordList.length ===0) return;
        currentIndex = index;
        render();
        await startReadSequence();
    }

    // 上一个
    document.getElementById('prevBtn').onclick = ()=>{
        if(wordList.length ===0) return;
        let idx = currentIndex - 1;
        if(idx <0) idx = wordList.length -1;
        switchWord(idx);
    }
    // 下一个
    document.getElementById('nextBtn').onclick = ()=>{
        if(wordList.length ===0) return;
        let idx = currentIndex + 1;
        if(idx >= wordList.length) idx = 0;
        switchWord(idx);
    }

    // 释义直接编辑，失去焦点保存
    meaningDisplay.onblur = function(){
        if(wordList.length ===0) return;
        wordList[currentIndex].userMean = this.innerText;
        saveStorage();
        statusTip.innerText = "✅ 释义已更新保存";
    }

    // ===== 添加单词弹窗 =====
    document.getElementById('addBtn').onclick = ()=>{
        addModal.style.display = "flex";
        inputWord.value = "";
        inputMeaning.value = "";
    }
    document.getElementById('closeModalBtn').onclick = ()=>{
        addModal.style.display = "none";
    }
    // 保存单词
    document.getElementById('saveWordBtn').onclick = ()=>{
        const w = inputWord.value.trim();
        const m = inputMeaning.value.trim();
        if(!w){
            statusTip.innerText = "⚠️ 请输入英文单词";
            return;
        }
        const hasExist = wordList.find(x=>x.en.toLowerCase() === w.toLowerCase());
        if(hasExist){
            statusTip.innerText = "⚠️ 该单词已存在";
            return;
        }
        wordList.push({en:w, userMean:m});
        saveStorage();
        currentIndex = wordList.length -1;
        render();
        addModal.style.display = "none";
        statusTip.innerText = "✅ 单词添加成功";
    }
    // 跳转欧路词典
    document.getElementById('openEudicBtn').onclick = ()=>{
        const w = inputWord.value.trim();
        if(w){
            window.open(`eudic://dict/${w}`);
        }else{
            statusTip.innerText = "⚠️ 请先输入单词";
        }
    }
    // 导入txt
    fileImport.onchange = function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev=>{
            const text = ev.target.result;
            const lines = text.split(/\r?\n/);
            let addCnt =0;
            lines.forEach(line=>{
                const w = line.trim();
                if(!w) return;
                const exist = wordList.find(x=>x.en.toLowerCase() === w.toLowerCase());
                if(!exist){
                    wordList.push({en:w, userMean:""});
                    addCnt++;
                }
            })
            saveStorage();
            render();
            addModal.style.display="none";
            statusTip.innerText = `✅ 导入完成，新增${addCnt}个单词`;
        }
        reader.readAsText(file);
    }

    // ===== 遮挡设置 =====
    document.getElementById('maskBtn').onclick = ()=>{
        maskModal.style.display = "flex";
    }
    document.getElementById('maskEn').onclick = ()=>{
        wordDisplay.classList.add("mask-word");
        meaningDisplay.classList.remove("mask-meaning");
        maskModal.style.display="none";
    }
    document.getElementById('maskZh').onclick = ()=>{
        wordDisplay.classList.remove("mask-word");
        meaningDisplay.classList.add("mask-meaning");
        maskModal.style.display="none";
    }
    document.getElementById('maskAllOff').onclick = ()=>{
        wordDisplay.classList.remove("mask-word");
        meaningDisplay.classList.remove("mask-meaning");
        maskModal.style.display="none";
    }

    // 朗读逻辑：单词读3遍，释义读一遍，停顿跟读
    async function startReadSequence(){
        if(wordList.length ===0) return;
        const item = wordList[currentIndex];
        speechSynthesis.cancel();
        statusTip.innerText = "🔊 正在朗读";
        await speak(item.en);
        await sleep(1100);
        await speak(item.en);
        await sleep(1100);
        await speak(item.en);
        await sleep(1600);
        if(item.userMean){
            await speak(item.userMean);
            await sleep(2200);
        }
        statusTip.innerText = "✅ 本轮跟读结束";
    }
    function speak(text){
        return new Promise(resolve=>{
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'en-US';
            ut.rate = 0.95;
            ut.onend = resolve;
            speechSynthesis.speak(ut);
        })
    }
    function sleep(ms){
        return new Promise(resolve=>setTimeout(resolve, ms));
    }

    // 点击空白关闭弹窗
    window.onclick = function(e){
        if(e.target === addModal) addModal.style.display="none";
        if(e.target === maskModal) maskModal.style.display="none";
    }

    loadFromStorage();
</script>
</body>
</html>
