<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词跟读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        body {
            background-color: #f4f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            padding-bottom: 80px;
        }
        .container {
            width: 100%;
            max-width: 620px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap:8px;
        }
        .btn {
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-top-left {
            background-color: #607d8b;
            color: white;
        }
        .btn-top-right {
            background-color: #2196f3;
            color: white;
        }
        .btn-list {
            position: fixed;
            left:16px;
            bottom:20px;
            background:#3949ab;
            color:#fff;
            font-size:16px;
            padding:12px 16px;
            border-radius:12px;
            border:none;
            cursor:pointer;
            z-index:10;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 4px 16px #00000012;
            text-align: center;
        }
        .word-text {
            font-size: 42px;
            font-weight: bold;
            color: #222;
            margin-bottom: 24px;
        }
        .meaning-area {
            font-size: 20px;
            color: #444;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #e4e7ed;
            border-radius: 12px;
            margin-bottom:36px;
            white-space: pre-line;
        }
        .control-row {
            display: flex;
            gap:24px;
            justify-content: center;
        }
        .btn-prev {
            background-color: #9c27b0;
            color:white;
            font-size:22px;
            padding:14px 28px;
        }
        .btn-next {
            background-color: #009688;
            color:white;
            font-size:22px;
            padding:14px 28px;
        }
        .modal-wrap {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color: rgba(0,0,0,0.5);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:20;
        }
        .modal {
            background:#fff;
            border-radius:20px;
            width:100%;
            max-width:520px;
            max-height:85vh;
            padding:28px;
            position:relative;
            overflow-y:auto;
        }
        .close-x {
            position:absolute;
            top:16px;
            right:20px;
            font-size:32px;
            font-weight:bold;
            color:#000000;
            cursor:pointer;
        }
        /* ========== 【重点改：弹窗标题放大】 ========== */
        .modal h3 {
            margin-bottom:24px;
            font-size:24px;
        }
        .modal input, .modal textarea {
            width:100%;
            padding:12px;
            border-radius:10px;
            border:1px solid #ccc;
            margin-bottom:14px;
            font-size:16px;
        }
        .modal-buttons {
            display:flex;
            gap:16px;
            flex-wrap:wrap;
            margin-top:12px;
            justify-content:space-between;
        }
        .btn-modal-blue {
            background:#2196f3;
            color:white;
            font-size:24px;
            padding:18px 36px;
        }
        .btn-modal-orange {
            background:#ff9800;
            color:white;
            font-size:24px;
            padding:16px 32px;
        }
        .file-tip {
            font-size:14px;
            color:#666;
            margin:8px 0;
        }
        .status-tip {
            margin-top:24px;
            color:#666;
            font-size:15px;
            text-align:center;
        }
        /* ========== 【重点改：单词列表条目放大】 ========== */
        .word-item {
            padding:16px 12px;
            border-bottom:1px solid #eee;
            cursor:pointer;
            text-align:left;
            font-size:20px;
        }
        .word-item:hover {
            background:#f0f4f9;
        }
        /* ========== 【重点改：正序乱序按钮放大】 ========== */
        .select-mode-row {
            display:flex;
            gap:16px;
            margin-bottom:20px;
            justify-content:center;
        }
        .mode-btn {
            padding:14px 30px;
            border-radius:10px;
            border:1px solid #ccc;
            background:#fff;
            cursor:pointer;
            font-size:20px;
        }
        .mode-btn.active {
            background:#2196f3;
            color:#fff;
            border-color:#2196f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <button class="btn btn-top-left" id="maskBtn">遮挡设置</button>
            <button class="btn btn-top-right" id="addBtn">+ 添加单词</button>
        </div>

        <div class="card">
            <div class="word-text" id="wordDisplay">--</div>
            <div class="meaning-area" id="meaningDisplay" contenteditable="true">请添加单词</div>
            <div class="control-row">
                <button class="btn btn-prev" id="prevBtn">上一个</button>
                <button class="btn btn-next" id="nextBtn">下一个</button>
            </div>
        </div>
        <div class="status-tip" id="statusTip">单词保存在浏览器本地</div>
    </div>

    <!-- 左下角：单词列表按钮 -->
    <button class="btn-list" id="openListBtn">📖 所有单词</button>

    <!-- 添加单词弹窗 -->
    <div class="modal-wrap" id="addModal">
        <div class="modal">
            <span class="close-x" id="closeAddX">×</span>
            <h3>新增单词</h3>
            <input type="text" id="inputWord" placeholder="输入英文单词">
            <textarea id="inputMeaning" rows="3" placeholder="输入你的专属释义"></textarea>
            <div class="file-tip">导入文件：仅支持TXT，一行一个英文单词，自动添加，释义后续手动填写</div>
            <input type="file" id="fileImport" accept=".txt">
            <div class="modal-buttons">
                <button class="btn btn-modal-orange" id="openEudicBtn">跳转欧路</button>
                <button class="btn btn-modal-blue" id="saveWordBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 遮挡选项弹窗，只保留英文、中文 -->
    <div class="modal-wrap" id="maskModal">
        <div class="modal">
            <span class="close-x" id="closeMaskX">×</span>
            <h3>遮挡选项</h3>
            <div class="modal-buttons">
                <button class="btn btn-modal-blue" id="maskEn">英文</button>
                <button class="btn btn-modal-orange" id="maskZh">中文</button>
            </div>
        </div>
    </div>

    <!-- 单词列表弹窗（就是截图里这个弹窗，字体已放大） -->
    <div class="modal-wrap" id="listModal">
        <div class="modal">
            <span class="close-x" id="closeListX">×</span>
            <h3>选择起始单词（只复习该词往后）</h3>
            <div class="select-mode-row">
                <button class="mode-btn active" data-mode="normal">正序</button>
                <button class="mode-btn" data-mode="shuffle">乱序</button>
            </div>
            <div id="wordListBox"></div>
        </div>
    </div>

<script>
    let wordList = [];
    let slicePool = [];
    let slicePtr = 0;
    let reviewMode = "normal";
    // 默认：无遮挡，中英文全部显示
    let maskType = "none"; // none / en / zh

    const wordDisplay = document.getElementById('wordDisplay');
    const meaningDisplay = document.getElementById('meaningDisplay');
    const statusTip = document.getElementById('statusTip');
    const addModal = document.getElementById('addModal');
    const maskModal = document.getElementById('maskModal');
    const listModal = document.getElementById('listModal');
    const wordListBox = document.getElementById('wordListBox');
    const inputWord = document.getElementById('inputWord');
    const inputMeaning = document.getElementById('inputMeaning');
    const fileImport = document.getElementById('fileImport');

    //加载单词
    function loadWords(){
        const saved = localStorage.getItem("wordData");
        if(saved){
            wordList = JSON.parse(saved);
        }else{
            wordList = [];
        }
    }
    function saveWords(){
        localStorage.setItem("wordData", JSON.stringify(wordList));
    }

    //初始化复习池
    function initSlicePool(){
        slicePool = [...wordList];
        slicePtr =0;
        render();
    }

    // 渲染当前词单词，遮挡替换为****
    function render() {
        if(slicePool.length === 0) {
            wordDisplay.innerText = "暂无单词";
            meaningDisplay.innerText = "点右上角 + 添加单词";
            return;
        }
        const item = slicePool[slicePtr];
        if(maskType === "en"){
            wordDisplay.innerText = "****";
            meaningDisplay.innerText = item.userMean;
        }else if(maskType === "zh"){
            wordDisplay.innerText = item.en;
            meaningDisplay.innerText = "****";
        }else{
            // 默认状态：全部显示
            wordDisplay.innerText = item.en;
            meaningDisplay.innerText = item.userMean;
        }
    }

    async function switchWordInPool(ptr) {
        if(slicePool.length ===0) return;
        slicePtr = ptr;
        render();
        await startReadSequence();
    }

    document.getElementById('prevBtn').onclick = ()=>{
        if(slicePool.length ===0) return;
        let idx = slicePtr -1;
        if(idx <0) idx = slicePool.length -1;
        switchWordInPool(idx);
    }
    document.getElementById('nextBtn').onclick = ()=>{
        if(slicePool.length ===0) return;
        let idx = slicePtr +1;
        if(idx >= slicePool.length) idx = 0;
        switchWordInPool(idx);
    }

    meaningDisplay.onblur = function(){
        if(slicePool.length ===0) return;
        const curEn = slicePool[slicePtr].en;
        const realItem = wordList.find(w=>w.en === curEn);
        if(realItem) realItem.userMean = this.innerText;
        saveWords();
        statusTip.innerText = "✅ 释义已更新保存";
    }

    // 添加单词弹窗
    document.getElementById('addBtn').onclick = ()=>{
        addModal.style.display = "flex";
        inputWord.value = "";
        inputMeaning.value = "";
    }
    document.getElementById('closeAddX').onclick = ()=>{
        addModal.style.display = "none";
    }
    document.getElementById('saveWordBtn').onclick = ()=>{
        const w = inputWord.value.trim();
        const m = inputMeaning.value.trim();
        if(!w){
            statusTip.innerText = "⚠️ 请输入英文单词";
            return;
        }
        const hasExist = wordList.find(x=>x.en.toLowerCase() === w.toLowerCase());
        if(hasExist){
            statusTip.innerText = "⚠️ 该单词已存在";
            return;
        }
        wordList.push({en:w, userMean:m});
        saveWords();
        initSlicePool();
        addModal.style.display = "none";
        statusTip.innerText = "✅ 单词添加成功";
    }
    document.getElementById('openEudicBtn').onclick = ()=>{
        const w = inputWord.value.trim();
        if(w){
            window.open(`eudic://dict/${w}`);
        }else{
            statusTip.innerText = "⚠️ 请先输入单词";
        }
    }
    fileImport.onchange = function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev=>{
            const text = ev.target.result;
            const lines = text.split(/\r?\n/);
            let addCnt =0;
            lines.forEach(line=>{
                const w = line.trim();
                if(!w) return;
                const exist = wordList.find(x=>x.en.toLowerCase() === w.toLowerCase());
                if(!exist){
                    wordList.push({en:w, userMean:""});
                    addCnt++;
                }
            })
            saveWords();
            initSlicePool();
            addModal.style.display="none";
            statusTip.innerText = `✅ 导入完成，新增${addCnt}个单词`;
        }
        reader.readAsText(file);
    }

    //遮挡逻辑，点击英文/中文切换遮挡；再次点击同一按钮恢复原状
    document.getElementById('maskBtn').onclick = ()=>{
        maskModal.style.display = "flex";
    }
    document.getElementById('closeMaskX').onclick = ()=>{
        maskModal.style.display = "none";
    }
    document.getElementById('maskEn').onclick = ()=>{
        maskType = maskType === "en" ? "none" : "en";
        render();
        maskModal.style.display="none";
    }
    document.getElementById('maskZh').onclick = ()=>{
        maskType = maskType === "zh" ? "none" : "zh";
        render();
        maskModal.style.display="none";
    }

    //单词列表弹窗
    document.getElementById('openListBtn').onclick = ()=>{
        renderWordListModal();
        listModal.style.display = "flex";
    }
    document.getElementById('closeListX').onclick = ()=>{
        listModal.style.display = "none";
    }
    document.querySelectorAll(".mode-btn").forEach(btn=>{
        btn.onclick = function(){
            document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
            this.classList.add("active");
            reviewMode = this.dataset.mode;
        }
    })
    function renderWordListModal(){
        wordListBox.innerHTML = "";
        wordList.forEach((item, realIdx)=>{
            const div = document.createElement("div");
            div.className = "word-item";
            div.innerText = `${realIdx+1}. ${item.en}｜${item.userMean||"(无释义)"}`;
            div.onclick = ()=>{
                const rawSlice = wordList.slice(realIdx);
                if(reviewMode === "shuffle"){
                    slicePool = shuffleArr(rawSlice);
                }else{
                    slicePool = [...rawSlice];
                }
                slicePtr = 0;
                render();
                listModal.style.display="none";
                statusTip.innerText = `✅ 从【${item.en}】开始复习，共${slicePool.length}个`;
            }
            wordListBox.appendChild(div);
        })
    }
    function shuffleArr(arr){
        const tmp = [...arr];
        for(let i=tmp.length-1;i>0;i--){
            const r = Math.floor(Math.random()*(i+1));
            [tmp[i],tmp[r]] = [tmp[r],tmp[i]];
        }
        return tmp;
    }

    //朗读
    async function startReadSequence(){
        if(slicePool.length ===0) return;
        const item = slicePool[slicePtr];
        speechSynthesis.cancel();
        statusTip.innerText = "🔊 正在朗读";
        await speak(item.en);
        await sleep(600);
        await speak(item.en);
        await sleep(600);
        await speak(item.en);
        await sleep(1000);
        if(item.userMean.trim() !== ""){
            await speak(item.userMean);
            await sleep(2200);
        }
        statusTip.innerText = "✅ 本轮跟读结束";
    }
    function speak(text){
        return new Promise(resolve=>{
            const ut = new SpeechSynthesisUtterance(text);
            if(/[\u4e00-\u9fa5]/.test(text)){
                ut.lang = 'zh-CN';
            }else{
                ut.lang = 'en-US';
            }
            ut.rate = 0.95;
            ut.onend = resolve;
            speechSynthesis.speak(ut);
        })
    }
    function sleep(ms){
        return new Promise(resolve=>setTimeout(resolve, ms));
    }

    window.onclick = function(e){
        if(e.target === addModal) addModal.style.display="none";
        if(e.target === maskModal) maskModal.style.display="none";
        if(e.target === listModal) listModal.style.display="none";
    }

    //初始化
    loadWords();
    initSlicePool();
</script>
</body>
</html>
